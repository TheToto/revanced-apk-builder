<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheToto Modded APKs Repository</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --border: #334155;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        h1 {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            text-align: center;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.3);
        }
        .card h2 {
            margin: 0;
            font-size: 1.25rem;
        }
        .microg-section {
            margin-bottom: 3rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
        }
        .microg-section h2 {
            margin: 0 0 1rem 0;
            font-size: 1.5rem;
        }
        .microg-section p {
            color: var(--text-secondary);
            margin: 0 0 1.5rem 0;
            line-height: 1.6;
        }
        .microg-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .badge-obtainium {
            display: inline-block;
            transition: transform 0.2s ease;
        }
        .badge-obtainium:hover {
            transform: translateY(-2px) scale(1.02);
        }
        .badge-obtainium img {
            height: 52px;
            width: auto;
            border-radius: 8px;
        }
        .btn-manual {
            display: inline-block;
            padding: 0.85rem 1.5rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            background-color: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }
        .btn-manual:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--text-secondary);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TheToto Modded APKs Repository</h1>

        <div class="microg-section">
            <h2>⚙️ MicroG RE</h2>
            <p>Some apps listed below (notably <strong>YouTube</strong> and <strong>Music</strong>) require <strong>MicroG RE</strong> to work properly on non-rooted devices. It replaces Google Play Services.</p>
            <div class="microg-actions">
                <a href="obtainium://app/%7B%22id%22%3A%20%22app.revanced.android.gms%22%2C%20%22url%22%3A%20%22https%3A%2F%2Fgithub.com%2FMorpheApp%2FMicroG-RE%22%2C%20%22author%22%3A%20%22MorpheApp%22%2C%20%22name%22%3A%20%22MicroG%20RE%22%7D" class="badge-obtainium">
                    <img src="https://raw.githubusercontent.com/ImranR98/Obtainium/main/assets/graphics/badge_obtainium.png" alt="Get it on Obtainium">
                </a>
                <a href="https://github.com/MorpheApp/MicroG-RE/releases" class="btn-manual">Manual Download</a>
            </div>
        </div>

        <div class="grid">
            <a href="youtube.html" class="card">
                <h2>YouTube</h2>
            </a>
            <a href="music.html" class="card">
                <h2>Music</h2>
            </a>
            <a href="reddit.html" class="card">
                <h2>Reddit</h2>
            </a>
            <a href="twitter.html" class="card">
                <h2>Twitter</h2>
            </a>
            <a href="facebook.html" class="card">
                <h2>Facebook</h2>
            </a>
            <a href="messenger.html" class="card">
                <h2>Messenger</h2>
            </a>
            <a href="instagram.html" class="card">
                <h2>Instagram</h2>
            </a>
        </div>
    </div>
</body>
</html>
