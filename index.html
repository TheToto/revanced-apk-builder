<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReVanced Repository</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --border: #334155;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        h1 {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        .app-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }
        .app-link:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.3);
        }
        .app-link h2 {
            margin: 0 0 0.5rem 0;
            font-size: 1.25rem;
        }
        .tag {
            font-size: 0.75rem;
            background-color: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ReVanced Repository</h1>
        <div class="grid">
            <a href="youtube-morphe.html" class="app-link">
                <h2>YouTube-Morphe</h2>
                <span class="tag">Active</span>
            </a>
            <a href="music-morphe.html" class="app-link">
                <h2>Music-Morphe</h2>
                <span class="tag">Active</span>
            </a>
            <a href="reddit-morphe.html" class="app-link">
                <h2>Reddit-Morphe</h2>
                <span class="tag">Active</span>
            </a>
            <a href="twitter.html" class="app-link">
                <h2>Twitter</h2>
                <span class="tag">Active</span>
            </a>
            <a href="instagram.html" class="app-link">
                <h2>Instagram</h2>
                <span class="tag">Active</span>
            </a>
        </div>
    </div>
</body>
</html>
